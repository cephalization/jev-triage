services:
  postgres:
    image: postgres:18
    command: postgres -c wal_level=logical
    environment:
      POSTGRES_DB: triage
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: pass
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d triage"]
      interval: 2s
      timeout: 2s
      retries: 30

volumes:
  pgdata:
