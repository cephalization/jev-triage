packages:
  - apps/*
  - packages/*

catalogMode: prefer

catalog:
  "@tanstack/react-router": ^1.170.36
  "@types/node": ^24
  cn: ^0.3.0
  emulate: ^0.11.2
  radix-ui: ^1.6.7
  typescript: ^7.0.2
  vite: npm:@voidzero-dev/vite-plus-core@0.3.2
  vite-plus: 0.3.2
  zod: ^4.6.5
overrides:
  vite@*: "catalog:"
  # The TypeSafe instrumentation 0.1.0 pins conventions 2.11.0, which predates the `typesafe`
  # provider and system values it sets; one copy of each OpenInference package, current.
  "@arizeai/openinference-semantic-conventions": "2.12.0"
  "@arizeai/openinference-core": "2.7.1"
peerDependencyRules:
  allowAny:
    - vite
  allowedVersions:
    vite: "*"
allowBuilds:
  "@google/genai": false
  "@rocicorp/zero-sqlite3": true
  esbuild: false
  protobufjs: false
minimumReleaseAgeExclude:
  - "@pierre/diffs@1.4.3"
  - "@arizeai/openinference-instrumentation-typesafe@0.1.0"
  - "@arizeai/openinference-semantic-conventions@2.12.0"
  - "@arizeai/openinference-core@2.7.1"
