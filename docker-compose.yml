services:
  postgres:
    image: postgres:18
    command: postgres -c wal_level=logical
    environment:
      POSTGRES_DB: triage
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: pass
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d triage"]
      interval: 2s
      timeout: 2s
      retries: 30

  # Arize Phoenix: traces of every guided review (jev calls, agent turns, tool calls, cost).
  # UI and OTLP/HTTP on 7006, OTLP/gRPC on 7004; SQLite under the phoenix_data volume.
  phoenix:
    image: arizephoenix/phoenix:version-20.14.0
    environment:
      PHOENIX_WORKING_DIR: /mnt/data
    ports:
      - "7006:6006"
      - "7004:4317"
    volumes:
      - phoenix_data:/mnt/data

volumes:
  pgdata:
  phoenix_data:
