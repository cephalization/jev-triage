services:
  postgres:
    image: postgres:18
    command: postgres -c wal_level=logical
    environment:
      POSTGRES_DB: triage
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: pass
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d triage"]
      interval: 2s
      timeout: 2s
      retries: 30

  # The reviewer cell: celld (Durable Objects, workerd) from the published image, running the
  # bundle the host builds into apps/reviewer/dist. It reaches the API and Phoenix through the
  # host and the compose network; the API reaches it on 9876.
  reviewer:
    image: ghcr.io/denoland/celld:v0.5.0
    command:
      - dev
      - /app
      - --host
      - 0.0.0.0
      - --port
      - "9876"
      - --watch-ignore
      - .celld/**
    ports:
      - "9876:9876"
    volumes:
      - ./apps/reviewer/wrangler.jsonc:/app/wrangler.jsonc:ro
      - ./apps/reviewer/dist:/app/dist:ro
      - reviewer_state:/app/.celld
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      # celld bounds a request handler (default 300 s) and one outbound fetch (default 120 s).
      # The reviewer hands back to the API after a minute of turns, so only a single long
      # provider response can reach either bound; give that room.
      CELLD_HANDLER_BUDGET_S: "1800"
      CELLD_FETCH_TIMEOUT_S: "1800"

  # Arize Phoenix: traces of every guided review (jev calls, agent turns, tool calls, cost).
  # UI and OTLP/HTTP on 7006, OTLP/gRPC on 7004; SQLite under the phoenix_data volume.
  phoenix:
    image: arizephoenix/phoenix:version-20.14.0
    environment:
      PHOENIX_WORKING_DIR: /mnt/data
    ports:
      - "7006:6006"
      - "7004:4317"
    volumes:
      - phoenix_data:/mnt/data

volumes:
  pgdata:
  phoenix_data:
  reviewer_state:
