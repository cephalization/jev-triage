# Generated by px-triage (`pxt automate`). Edit freely.
#
# New issues and pull requests get the "triage" label so they show up in
# the px-triage queue; px-triage removes the label as each item is handled.
name: Label new items for triage

on:
  issues:
    types: [opened, reopened]
  pull_request_target:
    types: [opened, reopened, ready_for_review]

permissions:
  issues: write
  pull-requests: write

jobs:
  label:
    if: (!(github.event_name == 'pull_request_target' && github.event.pull_request.user.login == 'github-actions[bot]' && startsWith(github.event.pull_request.head.ref, 'changeset-release/'))) && (!endsWith(github.actor, '[bot]')) && (!(github.event_name == 'pull_request_target' && github.event.pull_request.draft))
    runs-on: ubuntu-latest
    steps:
      - name: Make sure the label exists
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api --silent "repos/$GITHUB_REPOSITORY/labels/triage" \
            || gh api --silent -X POST "repos/$GITHUB_REPOSITORY/labels" \
                 -f name="triage" -f color="FBCA04" -f description="Needs triage"
      - name: Add the label
        env:
          GH_TOKEN: ${{ github.token }}
          NUMBER: ${{ github.event.issue.number || github.event.pull_request.number }}
        run: |
          gh api --silent -X POST "repos/$GITHUB_REPOSITORY/issues/$NUMBER/labels" \
            -f "labels[]=triage"
